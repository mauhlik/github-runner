name: Build and Release
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            gha_arch: x64
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm64
            gha_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      REGISTRY_USERNAME: ${{ vars.CONTAINER_REGISTRY_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}
      COMPONENT_NAME: github-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dockerfile metadata
        id: dockerfile
        run: |
          VERSION=$(grep -oP '(?<=ARG RUNNER_VERSION=)[^ ]+' Dockerfile)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_USERNAME }}/${{ env.COMPONENT_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.dockerfile.outputs.version }}
            type=semver,pattern=v{{version}},value=${{ steps.dockerfile.outputs.version }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}-${{ matrix.arch }}
          build-args: |
            TARGETARCH=${{ matrix.arch }}
            ARCHIVE_ARCH=${{ matrix.gha_arch }}

  # Optional: Combine into multi-arch manifest
  merge-manifest:
    runs-on: ubuntu-24.04
    needs: build-and-release
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker manifest create \
            ${{ vars.CONTAINER_REGISTRY_USERNAME }}/${{ env.COMPONENT_NAME }}:${{ needs.build-and-release.outputs.version }} \
            --amend ${{ vars.CONTAINER_REGISTRY_USERNAME }}/${{ env.COMPONENT_NAME }}:${{ needs.build-and-release.outputs.version }}-amd64 \
            --amend ${{ vars.CONTAINER_REGISTRY_USERNAME }}/${{ env.COMPONENT_NAME }}:${{ needs.build-and-release.outputs.version }}-arm64
          docker manifest push \
            ${{ vars.CONTAINER_REGISTRY_USERNAME }}/${{ env.COMPONENT_NAME }}:${{ needs.build-and-release.outputs.version }}